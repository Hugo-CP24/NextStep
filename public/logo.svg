  <!-- Checkmark dentro do círculo -->
  <polyline 
    points="124,120 132,128 148,112" 
    fill="none" 
    stroke="#10b981" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
