<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="32" fill="#10b981"/>
  
  <!-- Linhas da lista -->
  <line x1="35" y1="60" x2="135" y2="60" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <line x1="35" y1="90" x2="115" y2="90" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <line x1="35" y1="120" x2="95" y2="120" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- Círculo do check -->
